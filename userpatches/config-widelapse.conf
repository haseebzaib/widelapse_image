BOARD=orangepizero3
BRANCH=current
RELEASE=trixie
BUILD_DESKTOP=no
BUILD_MINIMAL=yes
KERNEL_CONFIGURE=no
HOST=widelapse
CONSOLE_AUTOLOGIN=no
# Our network installer owns NetworkManager and time/DNS services directly.
NETWORKING_STACK=none

# Requires the new factory partition layout
enable_extension widelapse-rauc

function user_config__widelapse_packages() {
    add_packages_to_image \
        net-tools \
        openssh-server \
        fail2ban \
        network-manager \
        modemmanager \
        libqmi-utils \
        mobile-broadband-provider-info \
        wpasupplicant \
        iw \
        rfkill \
        python3 \
        python3-gi \
        gir1.2-nm-1.0 \
        systemd-resolved \
        systemd-timesyncd \
        ca-certificates
}
